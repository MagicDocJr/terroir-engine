<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Engine demo round 2 — Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    #hud { position: fixed; left: 12px; top: 10px; color: #fff; font: 13px/1.4 ui-monospace, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
    #help { position: fixed; left: 12px; bottom: 10px; color: #fffc; font: 12px system-ui; text-shadow: 0 1px 2px #000; }
    #scenes { position: fixed; right: 12px; top: 10px; display: flex; gap: 6px; font: 13px system-ui; }
    #scenes a { color: #fff; text-decoration: none; background: #0008; border: 1px solid #fff3; border-radius: 6px; padding: 5px 10px; }
    #scenes a:hover { background: #000c; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="help">Click to look · WASD walk · Shift run · Vineyard: P next weather · T +1 hour · 1–9 camera shots · F fps</div>
  <nav id="scenes"><a href="?scene=vineyard">Vineyard</a><a href="?scene=cellar">Cellar</a><a href="?scene=hall">Hall</a><a href="/dashboard.html">Dashboard</a></nav>
  <script type="module" src="/src/r2/app.js"></script>

</html>
